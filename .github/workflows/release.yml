name: Release Agent Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

      - name: Tag matches the collector version
        if: github.ref_type == 'tag'
        run: python -c "import os; from claude_usage.constants import APP_VERSION as v; assert os.environ['GITHUB_REF_NAME'] == 'v' + v, (os.environ['GITHUB_REF_NAME'], v)"

  build:
    name: Build ${{ matrix.asset_name }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            asset_name: claude-usage-agent-linux-x64
            output_name: claude-usage-agent
          - runner: ubuntu-24.04-arm
            asset_name: claude-usage-agent-linux-arm64
            output_name: claude-usage-agent
          - runner: macos-15-intel
            asset_name: claude-usage-agent-darwin-x64
            output_name: claude-usage-agent
          - runner: macos-15
            asset_name: claude-usage-agent-darwin-arm64
            output_name: claude-usage-agent
          - runner: windows-2025
            asset_name: claude-usage-agent-windows-x64.exe
            output_name: claude-usage-agent.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install pyinstaller==6.22.2 certifi==2026.7.22

      - name: Build standalone executable
        run: pyinstaller --onefile --name claude-usage-agent claude_usage_analyzer.py

      - name: Smoke test executable
        shell: bash
        run: |
          "dist/${{ matrix.output_name }}" --help > /dev/null
          "dist/${{ matrix.output_name }}" --enroll --no-color && exit 1 || test $? -eq 2

      - name: Stage Unix asset
        if: runner.os != 'Windows'
        run: |
          chmod +x "dist/${{ matrix.output_name }}"
          cp "dist/${{ matrix.output_name }}" "${{ matrix.asset_name }}"

      - name: Stage Windows asset
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item "dist/${{ matrix.output_name }}" "${{ matrix.asset_name }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error

  publish:
    name: Publish release assets
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            RELEASE_NAME="${GITHUB_REF_NAME}"
            gh release view "$RELEASE_NAME" >/dev/null 2>&1 || gh release create "$RELEASE_NAME" --title "$RELEASE_NAME" --notes "Claude Usage Agent $RELEASE_NAME"
          else
            RELEASE_NAME="dev-latest"
            gh release view "$RELEASE_NAME" >/dev/null 2>&1 || gh release create "$RELEASE_NAME" --prerelease --title "$RELEASE_NAME" --notes "Manual development build"
          fi
          (cd release-assets && sha256sum claude-usage-agent-* > SHA256SUMS && cat SHA256SUMS)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # Tagged releases are immutable: re-pushing a tag must not silently replace published binaries.
            gh release upload "$RELEASE_NAME" release-assets/*
          else
            gh release upload "$RELEASE_NAME" release-assets/* --clobber
          fi
