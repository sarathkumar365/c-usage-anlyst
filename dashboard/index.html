    function renderTab() {
      if (!model) return state.loading ? `<div class="empty">Loading usage…</div>` : `<div class="empty">No data loaded yet.</div>`;
      if (!model.people.length) return `<div class="empty">No usage is visible for ${esc(state.config.orgId)}. If you expected data, ask an admin to add your account to the organization.</div>`;
      const views = { brief: renderBrief, share: renderShare, lanes: renderLanes, people: renderPeople, projects: renderProjects, sessions: renderSessions, collectors: renderCollectors };
      return `<div class="view">${(views[state.tab] || renderBrief)()}</div>`;
    }

    const personAction = (p) => `data-action="open-person" data-key="${esc(p.key)}"`;
    const statusBadge = (p) => `<span class="status"><span class="dot" style="background:${p.status.color}"></span>${p.status.label}</span>`;

    // ---------------------------------------------------------------------------
    // Rendering: Brief
    // ---------------------------------------------------------------------------
    function renderAccountStrip() {
      const { account } = model;
      if (!account.latest) {
        return `<section class="panel account-strip"><div class="stack" style="gap:4px;"><span class="kicker">Shared account</span><span style="font-size:13px;color:var(--ink-3);">No account usage % reported yet. It arrives from machines running Claude Desktop or with the collector’s statusline capture.</span></div></section>`;
      }
      const meter = (label, value, resets) => `
        <div class="stack" style="gap:2px;">
          <span style="display:flex;justify-content:space-between;gap:8px;font-size:13px;"><span>${label}</span><span class="mono">${value === null || value === undefined ? "—" : `${Math.round(num(value))}%`}</span></span>
          <div class="meter"><div style="width:${Math.min(100, num(value))}%"></div></div>
          ${resets ? `<span class="muted" style="font-size:12px;">Resets ${esc(new Date(resets).toLocaleString("en-US", { weekday: "short", hour: "numeric", minute: "2-digit" }))}</span>` : ""}
        </div>`;
      const series = account.points.slice(-120);
      const peak = Math.max(1, ...series.map((row) => num(row.five_hour_pct)));
      const spark = `<div class="spark" aria-hidden="true">${series.map((row) => `<div style="height:${Math.max(2, (num(row.five_hour_pct) / peak) * 100)}%"></div>`).join("")}</div>`;
      const gap = account.unattributedShare;
      const gapText = gap === null ? "Not enough samples in this range to compare with tracked activity."
        : gap < 0.05 ? "Almost all of the account’s usage lines up with activity from tracked machines."
        : `${pct(gap)} of the rise in 5-hour usage happened while no tracked machine was active (claude.ai web or a machine without the collector). Estimate.`;
      return `
        <section class="panel account-strip">
          <div class="stack" style="gap:4px;">
            <span class="kicker">Shared account · ${esc(account.name)}</span>
            <span class="muted" style="font-size:12px;">${account.collectors} collector${account.collectors === 1 ? "" : "s"} signed in · as of ${esc(timeAgo(account.latest.bucket_at))}</span>
          </div>
          <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;">
            ${meter("5-hour limit", account.latest.five_hour_pct, account.latest.five_hour_resets_at)}
            ${meter("7-day limit", account.latest.seven_day_pct, account.latest.seven_day_resets_at)}
          </div>
          <div class="stack" style="gap:6px;">${spark}<span class="muted" style="font-size:12px;">${esc(gapText)}</span></div>
        </section>`;
    }

    function renderBrief() {
      const { ranked, range } = model;
      if (!ranked.length) return `<div class="empty">No Claude usage was recorded ${range.days ? `in the last ${range.days} days` : "yet"}.</div>${renderAccountStrip()}`;
      const top = ranked[0];
      const only = ranked.length === 1;
      const change = model.prevTotal ? (model.total - model.prevTotal) / model.prevTotal : null;
      const deltaText = !range.days
        ? (model.firstDay ? `since ${new Date(model.firstDay + "T00:00:00").toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" })}` : "")
        : change === null ? `with no usage in the ${range.days} days before` : `${change >= 0 ? "up" : "down"} ${pct(Math.abs(change))} on the previous ${range.days} days`;
      const peopleWord = `${ranked.length} ${ranked.length === 1 ? "person" : "people"}`;
      const dek = `The team used ${compact(model.total)} tokens across ${peopleWord}${deltaText ? `, ${deltaText}` : ""}. ${model.cacheShare >= 0.5 ? `${pct(model.cacheShare)} of those tokens were context being reread rather than new work, so the heaviest users are usually the ones keeping long sessions open.` : ""}`;
      const headlineRest = only ? `accounted for all of the team’s Claude usage, ${headlinePhrase(top)}.` : `drove ${pct(top.share)} of the team’s Claude usage, mostly ${headlinePhrase(top)}.`;

      const ranking = ranked.slice(0, 8).map((p, i) => `
        <button class="rank-row ${i >= 5 ? "minor" : ""}" ${personAction(p)}>
          <span class="mono muted" style="font-size:12px;">${i + 1}</span>
          <span class="stack"><span class="name ellipsis" style="font-size:14px;">${esc(p.name)}</span><span class="rule" style="width:${(p.tokens / top.tokens) * 100}%"></span></span>
          <span class="mono" style="text-align:right;font-size:13px;">${pct1(p.share)}</span>
        </button>`).join("");

      const stale = ranked.find((p) => p.stale) || model.people.find((p) => p.stale && p.meta);
      const storyPeople = [ranked[1], ranked[2]].filter(Boolean);
      if (stale && !storyPeople.includes(stale)) storyPeople.push(stale); else if (ranked[3]) storyPeople.push(ranked[3]);
      const stories = storyPeople.slice(0, 3).map((p) => renderStory(p, p === stale && p.stale)).join("");
      const rest = ranked.filter((p) => p !== top && !storyPeople.includes(p)).slice(0, 4);
      const also = rest.length ? "Also: " + rest.map((p) => `${esc(p.name)}: ${esc(lowerFirst(p.reasons[0].text))}`).join(" · ") : "";

      return `
        <section class="brief-hero">
          <div>
            <span class="kicker">${range.kicker}</span>
            <h2><button ${personAction(top)}>${esc(top.name)}</button> ${esc(headlineRest)}</h2>
            <p class="dek">${esc(dek)}</p>
          </div>
          <aside class="ranking"><span class="kicker" style="margin-bottom:10px;">The ranking</span>${ranking}</aside>
        </section>
        ${renderAccountStrip()}
        ${stories ? `<section class="stories">${stories}</section>` : ""}
        <footer class="brief-foot"><span>${also}</span><button class="link-btn" style="font-size:13px;color:var(--ink);text-decoration:underline;" data-action="tab" data-id="share">See it as shares</button></footer>`;
    }

    function renderStory(p, attention) {
      const rank = model.ranked.indexOf(p) + 1;
      if (attention) {
        return `
          <article class="story" role="button" tabindex="0" ${personAction(p)}>
            <span class="kicker alert" style="letter-spacing:0;text-transform:none;font-size:12px;">${rank ? `No. ${rank} · ` : ""}Numbers may be behind</span>
            <h3>${esc(p.name)}’s latest usage isn’t counted yet</h3>
            <p>${esc(`The collector on ${p.machine} last synced ${timeAgo(p.lastSync)}. Anything ${firstName(p.name)} did after that will appear on the next sync${p.tokens ? `, so the real share is likely above ${pct1(p.share)}` : ""}.`)}</p>
          </article>`;
      }
      const [lead, ...others] = p.reasons;
      const projects = sortedEntries(p.projects).slice(0, 2).map(([name, tokens]) => `${name} (${pct(tokens / p.tokens)})`).join(" and ");
      const tools = p.tools.slice().sort((a, b) => b.calls - a.calls).slice(0, 3).map((t) => t.tool).join(", ");
      const body = [projects && `Working on ${projects}.`, ...others.map((r) => `${r.text}.`), tools && `Most-used tools: ${tools}.`].filter(Boolean).join(" ");
      const days = [];
      for (let i = 13; i >= 0; i--) days.push(p.days.get(dayKey(addDays(model.today, -i))) || 0);
      const peak = Math.max(...days);
      const spark = peak ? `<div class="spark" aria-hidden="true">${days.map((v) => `<div class="${v === peak ? "peak" : ""}" style="height:${Math.max(4, (v / peak) * 100)}%"></div>`).join("")}</div><span class="muted" style="font-size:12px;">Daily tokens, last 14 days</span>` : "";
      return `
        <article class="story" role="button" tabindex="0" ${personAction(p)}>
          <span class="kicker" style="letter-spacing:0;text-transform:none;font-size:12px;">No. ${rank} · ${pct1(p.share)} · ${compact(p.tokens)} tokens</span>
          <h3>${esc(p.name)}: ${esc(lowerFirst(lead.text))}</h3>
          <p>${esc(body)}</p>
          ${spark}
        </article>`;
    }

    // ---------------------------------------------------------------------------
    // Rendering: Share (treemap laid out after the container is measured)
    // ---------------------------------------------------------------------------
    function renderShare() {
      const lenses = [["people", "People"], ["projects", "Projects"], ["models", "Models"]].map(([id, label]) => `<button data-action="lens" data-id="${id}" aria-pressed="${state.lens === id}">${label}</button>`).join("");
      const noun = { people: "person", projects: "project", models: "model" }[state.lens];
      return `
        <div style="display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:14px;flex-wrap:wrap;">
          <div class="seg" role="group" aria-label="Group by">${lenses}</div>
          <span class="muted" style="font-size:12px;">Area is tokens by ${noun} · ${model.range.kicker.toLowerCase()}${state.lens === "people" ? " · click a block for details" : ""}</span>
        </div>
        <div class="field" id="field"></div>`;
    }

    function shareItems() {
      if (state.lens === "projects") {
        return model.projects.filter((p) => p.tokens > 0).map((p) => ({
          value: p.tokens, title: p.name, meta: `${p.people.size} ${p.people.size === 1 ? "person" : "people"} · ${compact(p.tokens)}`, mono: true,
          lines: [sortedEntries(p.people).slice(0, 3).map(([key, tokens]) => `${model.byKey.get(key)?.name || "Unknown"} ${pct(tokens / p.tokens)}`).join(" · "), `${pct(p.tokens ? p.cache / p.tokens : 0)} context reuse`],
        }));
      }
      if (state.lens === "models") {
        return model.models.filter((m) => m.tokens > 0).map((m) => {
          const mainFor = model.ranked.filter((p) => p.topModel === m.name).length;
          return { value: m.tokens, title: m.name, meta: compact(m.tokens), mono: true, lines: [mainFor ? `Main model for ${mainFor} ${mainFor === 1 ? "person" : "people"}` : `${int(m.requests)} requests`, m.web ? `${int(m.web)} web searches` : ""].filter(Boolean) };
        });
      }
      return model.ranked.map((p) => ({
        value: p.tokens, title: p.name, meta: `${p.machine} · ${compact(p.tokens)}`, person: p,
        lines: p.reasons.map((r) => r.text), strip: sortedEntries(p.projects).map(([name, tokens]) => [name, tokens / p.tokens]),
        flag: p.stale ? `Collector last synced ${timeAgo(p.lastSync)}` : null,
      }));
    }

    function squarify(values, width, height) {
      const out = [];
      const scale = (width * height) / values.reduce((a, b) => a + b, 0);
      let x = 0; let y = 0; let w = width; let h = height;
      const rest = values.map((v, i) => ({ area: v * scale, i }));
      let row = [];
      const worst = (items, side) => {
        const sum = items.reduce((acc, r) => acc + r.area, 0);
        const max = Math.max(...items.map((r) => r.area));
        const min = Math.min(...items.map((r) => r.area));
        return Math.max((side * side * max) / (sum * sum), (sum * sum) / (side * side * min));
      };
      const place = () => {
        const sum = row.reduce((acc, r) => acc + r.area, 0);
        if (w >= h) {
          const cw = sum / h; let cy = y;
          for (const r of row) { const rh = r.area / cw; out[r.i] = { x, y: cy, w: cw, h: rh }; cy += rh; }
          x += cw; w -= cw;
        } else {
          const rh = sum / w; let cx = x;
          for (const r of row) { const rw = r.area / rh; out[r.i] = { x: cx, y, w: rw, h: rh }; cx += rw; }
          y += rh; h -= rh;
        }
        row = [];
      };
      while (rest.length) {
        const side = Math.min(w, h);
        if (!row.length || worst([...row, rest[0]], side) <= worst(row, side)) row.push(rest.shift());
        else place();
      }
      if (row.length) place();
      return out;
    }

    function layoutField() {
      const field = document.getElementById("field");
      if (!field || !model) return;
      const items = shareItems();
      if (!items.length) { field.innerHTML = `<div class="empty">No usage in this range.</div>`; return; }
      const width = field.clientWidth;
      const height = field.clientHeight;
      const totalValue = items.reduce((acc, it) => acc + it.value, 0);
      const rects = squarify(items.map((it) => it.value), width, height);
      field.innerHTML = items.map((it, i) => {
        const r = rects[i];
        const w = r.w - 4; const h = r.h - 4;
        const dark = i < 4;
        const tiny = w < 90 || h < 60;
        const size = Math.sqrt(Math.max(1, w * h));
        const big = Math.round(Math.max(28, Math.min(112, size / 4.2)));
        const lineCount = h > 330 && w > 420 ? 3 : h > 240 ? 2 : 1;
        const ink = dark ? { title: "#f3f1ea", meta: "#b3afa4", line: "#dcd8cd", strip: "rgba(255,255,255,0.08)" } : { title: "#1d1c19", meta: "#4d4b46", line: "#34322e", strip: "rgba(29,28,25,0.06)" };
        const titlePx = Math.round(Math.min(24, 15 + size / 70));
        const hasStrip = !tiny && it.strip && h > 220 && w > 260;
        const lines = tiny || h < 190 ? [] : it.lines.slice(0, w < 220 ? 1 : lineCount);
        const attrs = it.person ? `role="button" tabindex="0" ${personAction(it.person)}` : "";
        const titleText = `${it.title}: ${pct(it.value / totalValue)}`;
        return `
          <div class="tile" ${attrs} title="${esc(titleText)}" style="left:${(r.x + 2).toFixed(1)}px;top:${(r.y + 2).toFixed(1)}px;width:${w.toFixed(1)}px;height:${h.toFixed(1)}px;background:${INK_SCALE[Math.min(i, INK_SCALE.length - 1)]};color:${ink.title};${it.person ? "cursor:pointer;" : ""}">
            ${tiny ? "" : `
            <div class="tile-body" style="padding:${w > 400 ? "20px 24px 16px" : "16px 16px 14px"};">
              <div class="tile-head">
                <div class="stack">
                  <span class="ellipsis" style="font-size:${titlePx}px;font-weight:500;letter-spacing:-0.01em;${it.mono ? "font-family:var(--mono);" : ""}">${esc(it.title)}</span>
                  <span class="mono ellipsis" style="font-size:12px;color:${ink.meta};">${esc(w < 300 ? it.meta.split(" · ").pop() : it.meta)}</span>
                </div>
                <span style="font-size:${big}px;line-height:0.8;letter-spacing:-0.05em;">${Math.round((it.value / totalValue) * 100)}<span style="font-size:${Math.round(big * 0.42)}px;letter-spacing:0;">%</span></span>
              </div>
              <div class="tile-lines">
                ${it.flag ? `<span class="flag"><span class="dot" style="background:#d2512a;width:6px;height:6px;"></span>${esc(it.flag)}</span>` : ""}
                ${lines.map((text) => `<span style="font-size:${w > 400 ? 15 : 13}px;line-height:1.35;color:${ink.line};text-wrap:pretty;">${esc(text)}</span>`).join("")}
              </div>
            </div>
            ${hasStrip ? `<div class="tile-strip">${it.strip.map(([name, part]) => `<div style="flex:${part} 1 0;background:${ink.strip};color:${ink.line};">${esc(part * w > 150 ? `${name} ${pct(part)}` : part * w > 70 ? name : "")}</div>`).join("")}</div>` : ""}`}
          </div>`;
      }).join("");
    }

    // ---------------------------------------------------------------------------
    // Rendering: Work lanes (always the last 7 days, 7am to 11pm local time)
    // ---------------------------------------------------------------------------
    function renderLanes() {
      const OPEN = 7; const HOURS = 16;
      const start = model.laneStart;
      const pos = (date) => {
        const dayIndex = Math.round((startOfDay(date) - start) / DAY_MS); // local midnights are 23 or 25h apart across DST
        const hour = Math.min(OPEN + HOURS, Math.max(OPEN, date.getHours() + date.getMinutes() / 60));
        return ((dayIndex + (hour - OPEN) / HOURS) / 7) * 100;
      };
      const lanesPeople = model.people
        .map((p) => ({ p, sessions: p.allSessions.filter((s) => new Date(s.first_ts || s.last_ts) >= start && num(s.reported_total) > 0) }))
        .filter((x) => x.sessions.length)
        .map((x) => ({ ...x, tokens: x.sessions.reduce((acc, s) => acc + num(s.reported_total), 0) }))
        .sort((a, b) => b.tokens - a.tokens);
      if (!lanesPeople.length) return `<div class="lanes"><div class="empty" style="color:#8f8c84;">No sessions in the last 7 days.</div></div>`;
      const weekTotal = lanesPeople.reduce((acc, x) => acc + x.tokens, 0);
      const allSessions = lanesPeople.flatMap((x) => x.sessions);
      const maxTokens = Math.max(...allSessions.map((s) => num(s.reported_total)));
      const heavy = Math.max(150000, maxTokens * 0.5);
      // Label the biggest sessions, at most one per lane so labels never collide.
      const callouts = new Set();
      const labelledLanes = new Set();
      for (const { p, sessions } of lanesPeople.flatMap((x) => x.sessions.map((s) => ({ p: x.p, sessions: s }))).sort((a, b) => num(b.sessions.reported_total) - num(a.sessions.reported_total))) {
        if (callouts.size >= 3) break;
        if (labelledLanes.has(p.key) || sessions.is_subagent) continue;
        labelledLanes.add(p.key);
        callouts.add(sessions.session_id);
      }
      const nowX = pos(new Date());

      const days = [];
      for (let i = 0; i < 7; i++) days.push(addDays(start, i));
      const axis = days.map((d, i) => `<span class="mono" style="position:absolute;left:${(i / 7) * 100}%;padding-left:8px;font-size:11px;color:#8f8c84;">${d.toLocaleDateString("en-US", { weekday: "short" })} ${d.getDate()}</span>`).join("");
      const bands = days.map((d, i) => `<div style="position:absolute;left:${(i / 7) * 100}%;width:${100 / 7}%;top:0;bottom:0;border-left:1px solid #22211f;${d.getDay() === 0 || d.getDay() === 6 ? "background:#181817;" : ""}"></div>`).join("");

      const lanes = lanesPeople.map(({ p, sessions, tokens }, i) => {
        const bars = sessions.map((s) => {
          const first = new Date(s.first_ts || s.last_ts);
          const left = pos(first);
          const width = Math.max(0.35, Math.min(100 - left, (num(s.duration_seconds) / 3600 / HOURS / 7) * 100));
          const t = num(s.reported_total);
          const height = Math.round(4 + 30 * Math.sqrt(t / maxTokens));
          const top = s.is_subagent ? 60 : 96 / 2 - height / 2 + 4;
          const label = `${s.project_name || s.project} · ${duration(s.duration_seconds)} · ${compact(t)} tokens${s.is_subagent ? " · subagent" : ""}`;
          const bar = `<div class="session-bar ${s.is_subagent ? "sub" : t >= heavy ? "heavy" : ""}" title="${esc(label)}" style="left:${left.toFixed(2)}%;width:${width.toFixed(2)}%;top:${top.toFixed(1)}px;${s.is_subagent ? "" : `height:${height}px;`}"></div>`;
          if (!callouts.has(s.session_id) || s.is_subagent) return bar;
          return bar + `<div class="callout-line" style="left:${left.toFixed(2)}%;height:${Math.max(4, top - 8).toFixed(1)}px;"></div><span class="callout" style="left:${left.toFixed(2)}%;${left < 50 ? "transform:translateX(6px);" : ""}">${esc(`${duration(s.duration_seconds)} · ${compact(t)} · ${s.project_name || s.project}`)}</span>`;
        }).join("");
        const syncedAt = p.lastSync ? new Date(p.lastSync) : null;
        const staleBand = p.stale && syncedAt && syncedAt >= start
          ? `<div class="stale-band" style="left:${pos(syncedAt).toFixed(2)}%;width:${Math.max(0.3, nowX - pos(syncedAt)).toFixed(2)}%;"></div><span class="stale-label" style="left:${pos(syncedAt).toFixed(2)}%;${pos(syncedAt) < 50 ? "transform:translateX(6px);" : ""}">not synced since ${esc(timeAgo(p.lastSync))}</span>`
          : "";
        return `
          <div class="lane">
            <button class="lane-name" ${personAction(p)}>
              <span style="display:flex;align-items:baseline;gap:10px;">
                <span class="mono" style="font-size:12px;color:#6f6c65;width:14px;">${i + 1}</span>
                <span class="ellipsis" style="font-size:15px;font-weight:500;flex-grow:1;">${esc(p.name)}</span>
                <span class="mono" style="font-size:12px;color:#b9b6ad;">${pct(tokens / weekTotal)}</span>
              </span>
              <span style="padding-left:24px;font-size:12px;line-height:1.4;color:#8f8c84;">${esc(p.reasons[0].text)}</span>
            </button>
            <div class="lane-sessions">${bars}${staleBand}</div>
          </div>`;
      }).join("");

      return `
        <div class="lanes">
          <div class="lanes-head">
            <span>${state.range === "7" ? "" : "Work lanes always show the last 7 days. "}Each bar is one session between 7am and 11pm: length is time spent, height is tokens. Hover a bar for details.</span>
            <div class="legend">
              <span><span class="swatch" style="background:#5e5b55"></span>Session</span>
              <span><span class="swatch" style="background:#3987e5"></span>Over ${compact(heavy)} tokens</span>
              <span><span class="swatch" style="box-shadow:inset 0 0 0 1.5px #8f8c84"></span>Subagent</span>
            </div>
          </div>
          <div class="lane-axis"><span class="kicker" style="color:#6f6c65;">Ranked by tokens</span><div class="lane-track">${axis}<span class="mono" style="position:absolute;left:${nowX}%;top:-2px;font-size:11px;color:#b9b6ad;transform:translateX(6px);">now</span></div></div>
          <div class="lane-body">
            <div class="lane-bands">${bands}<div style="position:absolute;left:${nowX}%;top:-34px;bottom:0;width:1px;background:#ecebe6;opacity:0.45;"></div></div>
            ${lanes}
          </div>
        </div>`;
    }

    // ---------------------------------------------------------------------------
    // Rendering: data pages
    // ---------------------------------------------------------------------------
    const PEOPLE_COLS = "minmax(0,2.2fr) minmax(0,2.4fr) minmax(0,1fr) minmax(0,1.6fr) minmax(0,1.2fr) minmax(0,1.1fr) minmax(0,1fr)";
    function peopleRows() {
      const q = state.query.trim().toLowerCase();
      return model.people
        .filter((p) => p.meta || p.tokens)
        .filter((p) => !q || p.name.toLowerCase().includes(q) || p.machine.toLowerCase().includes(q))
        .sort((a, b) => b.tokens - a.tokens);
    }

    function renderPeople() {
      const rows = peopleRows();
      const max = Math.max(1, ...rows.map((p) => p.tokens));
      return `
        <div style="display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px;">
          <div style="position:relative;width:min(280px,100%);">
            <span style="position:absolute;left:10px;top:9px;color:var(--muted);">${icon("M7 11.5a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zM10.5 10.5l3 3", 14)}</span>
            <input class="input" style="padding-left:32px;" placeholder="Search people or machines" data-input="query" data-focus="query" value="${esc(state.query)}">
          </div>
          <span class="muted" style="font-size:12px;">${rows.length} ${rows.length === 1 ? "person" : "people"}</span>
        </div>
        <div class="panel table">
          <div class="trow head" style="grid-template-columns:${PEOPLE_COLS}"><span>Person</span><span>Tokens</span><span class="num">Requests</span><span>Top project</span><span>Top model</span><span>Last sync</span><span>Status</span></div>
          ${rows.map((p) => `
            <div class="trow clickable" style="grid-template-columns:${PEOPLE_COLS}" ${personAction(p)}>
              <span class="person-cell"><span class="avatar">${esc(initials(p.name))}</span><span class="stack"><span class="ellipsis" style="font-size:13px;font-weight:500;">${esc(p.name)}</span><span class="mono sub ellipsis">${esc(p.machine)}</span></span></span>
              <span class="tokens-cell"><span class="mono">${compact(p.tokens)}</span><span class="bar"><div style="width:${(p.tokens / max) * 100}%"></div></span><span class="mono">${pct(p.share)}</span></span>
              <span class="mono num" style="font-size:13px;color:var(--ink-3);">${int(p.requests)}</span>
              <span class="mono ellipsis" style="font-size:12px;">${esc(p.topProject || "—")}</span>
              <span class="mono ellipsis" style="font-size:12px;color:var(--ink-3);">${esc(p.topModel || "—")}</span>
              <span style="font-size:13px;color:var(--ink-3);">${esc(timeAgo(p.lastSync))}</span>
              ${p.meta ? statusBadge(p) : `<span class="muted" style="font-size:12px;">Activity only</span>`}
            </div>`).join("") || `<div class="empty">No one matches that search.</div>`}
        </div>`;
    }

    function renderProjects() {
      const projects = model.projects.filter((p) => p.tokens > 0);
      const models = model.models.filter((m) => m.tokens > 0);
      const max = Math.max(1, ...projects.map((p) => p.tokens));
      const colorFor = (i) => (i < MODEL_COLORS.length ? MODEL_COLORS[i] : OTHER_COLOR);
      const PCOLS = "minmax(0,1.6fr) minmax(0,2fr) minmax(0,0.7fr) minmax(0,0.8fr)";
      const MCOLS = "minmax(0,2fr) minmax(0,1fr) minmax(0,0.8fr) minmax(0,1fr)";
      return `
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:20px;align-items:start;">
          <section class="panel table">
            <div class="panel-head"><h2>Projects</h2><span class="muted" style="font-size:12px;">${projects.length} with usage</span></div>
            <div class="trow head" style="grid-template-columns:${PCOLS};min-width:520px;"><span>Project</span><span>Tokens</span><span class="num">People</span><span class="num">Context reuse</span></div>
            ${projects.map((p) => `
              <div class="trow" style="grid-template-columns:${PCOLS};min-width:520px;">
                <span class="mono ellipsis" style="font-size:13px;">${esc(p.name)}</span>
                <span class="tokens-cell"><span class="mono">${compact(p.tokens)}</span><span class="bar"><div style="width:${(p.tokens / max) * 100}%"></div></span><span class="mono">${pct(p.tokens / model.total)}</span></span>
                <span class="mono num" style="font-size:13px;color:var(--ink-3);">${p.people.size}</span>
                <span class="mono num" style="font-size:13px;color:var(--ink-3);">${pct(p.tokens ? p.cache / p.tokens : 0)}</span>
              </div>`).join("") || `<div class="empty">No project usage in this range.</div>`}
          </section>
          <section class="panel table">
            <div class="panel-head" style="flex-direction:column;align-items:stretch;gap:14px;">
              <h2>Models</h2>
              <div class="mix" aria-hidden="true">${models.map((m, i) => `<div style="flex:${m.tokens} 1 0;background:${colorFor(i)};border-radius:${i === 0 ? "3px 0 0 3px" : i === models.length - 1 ? "0 3px 3px 0" : "0"};"></div>`).join("")}</div>
            </div>
            <div class="trow head" style="grid-template-columns:${MCOLS};min-width:420px;"><span>Model</span><span class="num">Tokens</span><span class="num">Share</span><span class="num">Web searches</span></div>
            ${models.map((m, i) => `
              <div class="trow" style="grid-template-columns:${MCOLS};min-width:420px;">
                <span style="display:flex;align-items:center;gap:10px;min-width:0;"><span style="width:8px;height:8px;border-radius:2px;background:${colorFor(i)};flex-shrink:0;"></span><span class="mono ellipsis" style="font-size:12px;">${esc(m.name)}</span></span>
                <span class="mono num" style="font-size:13px;">${compact(m.tokens)}</span>
                <span class="mono num" style="font-size:13px;color:var(--ink-3);">${pct(m.tokens / model.total)}</span>
                <span class="mono num" style="font-size:13px;color:var(--ink-3);">${int(m.web)}</span>
              </div>`).join("") || `<div class="empty">No model usage in this range.</div>`}
          </section>
        </div>`;
    }

    function sessionRows() {
      return model.people.flatMap((p) => p.sessions.map((s) => ({ s, p })))
        .filter(({ s }) => state.sessionFilter === "all" || (state.sessionFilter === "sub" ? s.is_subagent : !s.is_subagent))
        .sort((a, b) => num(b.s.reported_total) - num(a.s.reported_total));
    }

    function renderSessions() {
      const rows = sessionRows();
      const filters = [["all", "All"], ["main", "Main"], ["sub", "Subagents"]].map(([id, label]) => `<button data-action="session-filter" data-id="${id}" aria-pressed="${state.sessionFilter === id}">${label}</button>`).join("");
      const COLS = "minmax(0,1.2fr) minmax(0,1.3fr) minmax(0,1.4fr) minmax(0,1.2fr) minmax(0,0.9fr) minmax(0,0.8fr) minmax(0,0.8fr) minmax(0,1fr)";
      return `
        <div style="display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px;">
          <div class="seg" role="group" aria-label="Session type">${filters}</div>
          <span class="muted" style="font-size:12px;">Sorted by tokens · ${rows.length} session${rows.length === 1 ? "" : "s"}</span>
        </div>
        <div class="panel table">
          <div class="trow head" style="grid-template-columns:${COLS}"><span>Session</span><span>Person</span><span>Project</span><span>Branch</span><span>From</span><span class="num">Tokens</span><span class="num">Duration</span><span class="num">Last activity</span></div>
          ${rows.slice(0, 200).map(({ s, p }) => `
            <div class="trow clickable" style="grid-template-columns:${COLS}" ${personAction(p)}>
              <span style="display:flex;align-items:center;gap:8px;min-width:0;"><span class="mono ellipsis" style="font-size:12px;" title="${esc(s.session_id)}">${esc(String(s.session_id).slice(0, 8))}</span>${s.is_subagent ? `<span class="tag">subagent</span>` : ""}</span>
              <span class="ellipsis" style="font-size:13px;">${esc(p.name)}</span>
              <span class="mono ellipsis" style="font-size:12px;color:var(--ink-3);">${esc(s.project_name || s.project)}</span>
              <span class="mono ellipsis" style="font-size:12px;color:var(--ink-3);" title="${esc(s.git_branch || "")}">${esc(s.git_branch || "—")}</span>
              <span class="ellipsis" style="font-size:13px;color:var(--ink-3);">${esc(sessionOrigin(s) || "—")}</span>
              <span class="mono num" style="font-size:13px;">${compact(s.reported_total)}</span>
              <span class="mono num" style="font-size:13px;color:var(--ink-3);">${duration(s.duration_seconds)}</span>
              <span class="num" style="font-size:13px;color:var(--ink-3);">${esc(timeAgo(s.last_ts))}</span>
            </div>`).join("") || `<div class="empty">No sessions in this range.</div>`}
          ${rows.length > 200 ? `<div class="empty" style="padding:16px;">Showing the 200 largest sessions.</div>` : ""}
        </div>`;
    }

    function renderCollectors() {
      const collectors = model.people.filter((p) => p.meta || p.collector || p.surfaces.size);
      const surfaceCount = (surface) => collectors.filter((p) => p.surfaces.has(surface)).length;
      const stats = [
        ["Claude Code", surfaceCount("claude_code"), "exact token counts"],
        ["Claude Desktop", collectors.filter((p) => ["desktop_chat", "desktop_app", "desktop_code"].some((s) => p.surfaces.has(s))).length, "chat is activity only; Code tab is exact"],
        ["Cowork", surfaceCount("cowork"), "exact tokens where transcripts exist"],
        ["Extensions", collectors.filter((p) => ["extensions", "ide_extension", "browser_extension"].some((s) => p.surfaces.has(s))).length, "IDE, Chrome, or Desktop extensions"],
      ].map(([label, value, note]) => `<div><span style="font-size:13px;color:var(--ink-3);">${label}</span><strong>${value}</strong><span class="muted" style="font-size:12px;">${value === 1 ? "collector" : "collectors"}, ${note}</span></div>`).join("");
      const COLS = "minmax(0,1.5fr) minmax(0,1.5fr) minmax(0,1.1fr) minmax(0,0.9fr) minmax(0,0.9fr) minmax(0,1.4fr) minmax(0,1fr)";
      const accountCell = (p) => p.claudeAccount
        ? `<span class="stack"><span class="ellipsis" style="font-size:13px;">${esc(p.claudeAccount.organization_name || "Unnamed organization")}</span><span class="sub ellipsis" style="font-size:12px;">${p.otherAccount ? `<span class="badge">Different account</span>` : esc(String(p.claudeAccount.organization_uuid || p.claudeAccount.account_uuid).slice(0, 8))}</span></span>`
        : `<span class="muted" style="font-size:12px;">Not reported</span>`;
      const tone = { bad: ["#fbe5e3", "#b42c2c"], warn: ["#fbefd5", "#9a5b00"] };
      return `
        <section class="panel stat-strip" style="margin-bottom:20px;">${stats}</section>
        <section class="panel table" style="margin-bottom:20px;">
          <div class="panel-head"><h2>Collectors</h2><span class="muted" style="font-size:12px;">A collector counts as stale after 2 hours without a sync</span></div>
          <div class="trow head" style="grid-template-columns:${COLS}"><span>Machine</span><span>Claude account</span><span>Platform</span><span>Version</span><span>Last sync</span><span>Surfaces found</span><span>Status</span></div>
          ${collectors.map((p) => `
            <div class="trow clickable" style="grid-template-columns:${COLS}" ${personAction(p)}>
              <span class="stack"><span class="mono ellipsis" style="font-size:12px;">${esc(p.machine)}</span><span class="sub ellipsis" style="font-size:12px;">${esc(p.name)}</span></span>
              ${accountCell(p)}
              <span class="ellipsis" style="font-size:13px;color:var(--ink-3);">${esc(platformLabel(p.platform) || "—")}</span>
              <span class="stack"><span class="mono" style="font-size:12px;color:var(--ink-3);">${esc(p.version || "—")}</span>${p.collector?.claude_code_version ? `<span class="sub mono" style="font-size:11px;">Code ${esc(p.collector.claude_code_version)}</span>` : ""}</span>
              <span style="font-size:13px;color:var(--ink-3);">${esc(timeAgo(p.lastSync))}</span>
              <span class="ellipsis" style="font-size:12px;color:var(--ink-3);">${esc(surfaceList(p.surfaces) || "—")}</span>
              ${p.meta || p.collector ? statusBadge(p) : `<span class="muted" style="font-size:12px;">No usage synced</span>`}
            </div>`).join("")}
        </section>
        <section class="panel" style="padding:18px 20px 6px;">
          <h2 style="margin:0 0 6px;font-size:14px;font-weight:600;">Open issues</h2>
          ${model.issues.map((issue) => `
            <div class="issue">
              <div class="issue-icon" style="background:${tone[issue.tone][0]};"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="${tone[issue.tone][1]}" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M6 3.2V6.3M6 8.6h.01"></path></svg></div>
              <div class="stack" style="gap:3px;"><span style="font-size:13px;">${esc(issue.title)}</span><span class="muted" style="font-size:12px;">${esc(issue.detail)}</span></div>
              <span class="muted" style="font-size:12px;">${esc(issue.seen)}</span>
            </div>`).join("") || `<div class="muted" style="padding:12px 0 14px;border-top:1px solid var(--line-soft);font-size:13px;">Nothing needs attention.</div>`}
        </section>`;
    }

    // ---------------------------------------------------------------------------
    // Rendering: person drawer
    // ---------------------------------------------------------------------------
    function renderDrawer() {
      const p = model && state.selected ? model.byKey.get(state.selected) : null;
      if (!p) return "";
      const days = [];
      const spanDays = Math.min(model.range.days || 30, 30);
      for (let i = spanDays - 1; i >= 0; i--) days.push(p.days.get(dayKey(addDays(model.today, -i))) || 0);
      const peak = Math.max(...days);
      const tools = p.tools.slice().sort((a, b) => b.calls - a.calls).slice(0, 4);
      const surfaces = surfaceList(p.surfaces);
      return `
        <div class="scrim" data-action="close-person"></div>
        <aside class="drawer" role="dialog" aria-label="${esc(p.name)}">
          <div class="drawer-head">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;">
              <div style="display:flex;align-items:center;gap:12px;min-width:0;">
                <div class="avatar" style="width:40px;height:40px;border-radius:20px;font-size:13px;">${esc(initials(p.name))}</div>
                <div class="stack" style="gap:2px;">
                  ${state.editing ? `
                    <form data-action="save-alias" style="display:flex;gap:6px;align-items:center;">
                      <input class="input" style="height:28px;width:180px;" data-input="draft" data-focus="draft" value="${esc(state.draft)}" aria-label="Display name">
                      <button class="btn primary" style="height:28px;font-size:12px;" type="submit">Save</button>
                      <button class="link-btn" style="font-size:12px;" type="button" data-action="cancel-edit">Cancel</button>
                    </form>` : `
                    <div style="display:flex;align-items:center;gap:8px;">
                      <span class="ellipsis" style="font-size:16px;font-weight:600;letter-spacing:-0.01em;">${esc(p.name)}</span>
                      <button class="link-btn" style="font-size:12px;" data-action="start-edit">Rename</button>
                    </div>`}
                  <span class="mono muted ellipsis" style="font-size:12px;">${esc(p.machine)}${platformLabel(p.platform) ? ` · ${esc(platformLabel(p.platform))}` : ""}</span>
                </div>
              </div>
              <button class="btn icon" style="border:0;background:none;" data-action="close-person" aria-label="Close">${icon("M4 4l8 8M12 4l-8 8", 14)}</button>
            </div>
            ${p.meta || p.collector ? `<div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);">${statusBadge(p)}<span>· synced ${esc(timeAgo(p.lastSync))} · agent ${esc(p.version || "unknown")}</span></div>` : ""}
          </div>
          <div class="drawer-why">
            <span class="muted" style="font-size:12px;">Why usage is ${p.share >= 0.2 ? "high" : "what it is"}</span>
            ${p.reasons.map((r) => `<span class="reason">${esc(r.text)}</span>`).join("")}
            ${tools.length ? `<span class="muted" style="font-size:12px;">Top tools: ${esc(tools.map((t) => `${t.tool} ${int(t.calls)}`).join(" · "))} (latest sync window)</span>` : ""}
          </div>
          <div class="drawer-body">
            <div class="big-stats">
              <div><span class="muted" style="font-size:12px;">Tokens</span><strong>${compact(p.tokens)}</strong></div>
              <div><span class="muted" style="font-size:12px;">Share of team</span><strong>${pct(p.share)}</strong></div>
              <div><span class="muted" style="font-size:12px;">Context reuse</span><strong>${pct(p.tokens ? p.cache / p.tokens : 0)}</strong></div>
            </div>
            ${peak ? `
              <div class="stack" style="gap:10px;">
                <span class="muted" style="font-size:12px;">Daily tokens, last ${spanDays} days</span>
                <div style="height:64px;display:flex;align-items:flex-end;gap:2px;border-bottom:1px solid #c9c6bd;">${days.map((v) => `<div title="${compact(v)}" style="flex:1 1 0;height:${v ? Math.max(2, (v / peak) * 64) : 0}px;background:var(--data);border-radius:2px 2px 0 0;"></div>`).join("")}</div>
              </div>` : ""}
            ${list("Projects", sortedEntries(p.projects).slice(0, 6).map(([name, tokens]) => [name, compact(tokens)]), true)}
            ${list("Models", sortedEntries(p.models).slice(0, 4).map(([name, tokens]) => [name, compact(tokens)]), true)}
            ${list("Branches", sortedEntries(p.sessions.reduce((map, s) => (s.git_branch ? bump(map, s.git_branch, num(s.reported_total)) : map), new Map())).slice(0, 5).map(([name, tokens]) => [name, compact(tokens)]), true)}
            ${list("Skills and plugins", p.features.slice().sort((a, b) => num(b.count) - num(a.count)).slice(0, 6).map((f) => [`${f.name} (${f.kind})`, `${int(f.count)} uses`]), true)}
            ${list("Collector", [["Claude account", p.claudeAccount ? `${p.claudeAccount.organization_name || "Unnamed"}${p.otherAccount ? " (different)" : ""}` : "Not reported"], ["Account label", p.account || "—"], ["Claude Code", [p.collector?.claude_code_version, p.collector?.install_method].filter(Boolean).join(" · ") || "—"], ["Surfaces found", surfaces || "—"], ["Requests", int(p.requests)], ["Sessions in range", String(p.sessions.length)]], false)}
          </div>
        </aside>`;
    }

    function list(title, rows, mono) {
      if (!rows.length) return "";
      return `<div class="stack"><span class="muted" style="font-size:12px;margin-bottom:6px;">${title}</span>${rows.map(([k, v]) => `<div class="kv"><span class="${mono ? "mono" : ""} ellipsis" style="${mono ? "font-size:12px;color:var(--ink);" : ""}">${esc(k)}</span><span class="${mono ? "mono" : ""}" style="${mono ? "font-size:12px;color:var(--ink-3);" : ""}">${esc(v)}</span></div>`).join("")}</div>`;
    }

    // ---------------------------------------------------------------------------
    // Actions
    // ---------------------------------------------------------------------------
    function exportCsv() {
      if (!model) return;
      let name = "people";
      let rows;
      if (state.tab === "projects") {
        name = "projects";
        rows = model.projects.map((p) => ({ project: p.name, tokens: p.tokens, share: (p.tokens / (model.total || 1)).toFixed(4), people: p.people.size, cache_share: (p.tokens ? p.cache / p.tokens : 0).toFixed(4), requests: p.requests }));
      } else if (state.tab === "sessions") {
        name = "sessions";
        rows = sessionRows().map(({ s, p }) => ({ session_id: s.session_id, person: p.name, machine: p.machine, project: s.project_name || s.project, branch: s.git_branch || "", from: sessionOrigin(s), subagent: s.is_subagent, tokens: s.reported_total, duration_seconds: s.duration_seconds, first_ts: s.first_ts, last_ts: s.last_ts }));
      } else {
        rows = model.people.filter((p) => p.meta || p.tokens).map((p) => ({ person: p.name, machine: p.machine, account: p.account, tokens: p.tokens, share: p.share.toFixed(4), requests: p.requests, top_project: p.topProject, top_model: p.topModel, reasons: p.reasons.map((r) => r.text).join("; "), last_sync: p.lastSync || "", status: p.status.label }));
      }
      if (!rows.length) return;
      const headers = Object.keys(rows[0]);
      const csv = [headers.join(","), ...rows.map((row) => headers.map((h) => `"${String(row[h] ?? "").replaceAll('"', '""')}"`).join(","))].join("\n");
      const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
      const a = document.createElement("a");
      a.href = url;
      a.download = `claude-usage-${name}-${model.range.id}-${dayKey(new Date())}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    const actions = {
      tab: (el) => { state.tab = el.dataset.id; store.set("tab", state.tab); render(); },
      range: (el) => { state.range = el.dataset.id; store.set("range", state.range); refresh(); },
      lens: (el) => { state.lens = el.dataset.id; render(); },
      "session-filter": (el) => { state.sessionFilter = el.dataset.id; render(); },
      "open-person": (el) => { state.selected = el.dataset.key; state.editing = false; render(); },
      "close-person": () => { state.selected = null; state.editing = false; render(); },
      "start-edit": () => { const p = model.byKey.get(state.selected); state.editing = true; state.draft = p ? p.name : ""; render(); },
      "cancel-edit": () => { state.editing = false; render(); },
      refresh: () => refresh(),
      export: () => exportCsv(),
      "sign-out": () => signOut(),
      "toggle-connection": () => {
        state.signin.showConnection = !state.signin.showConnection;
        if (!state.signin.showConnection) {
          store.set("supabaseUrl", state.config.supabaseUrl); store.set("anonKey", state.config.supabaseKey); store.set("orgId", state.config.orgId);
          connect();
        }
        render();
      },
      "signin-reset": () => { state.signin.sent = false; render(); },
    };

    document.addEventListener("click", (event) => {
      const el = event.target.closest("[data-action]");
      if (!el || el.tagName === "FORM") return;
      const handler = actions[el.dataset.action];
      if (handler) { event.preventDefault(); handler(el); }
    });
    document.addEventListener("submit", (event) => {
      const form = event.target.closest("form[data-action]");
      if (!form) return;
      event.preventDefault();
      if (form.dataset.action === "send-link") sendLink();
      if (form.dataset.action === "save-alias") saveAlias();
    });
    document.addEventListener("input", (event) => {
      const el = event.target.closest("[data-input]");
      if (!el) return;
      const key = el.dataset.input;
      if (key === "query") { state.query = el.value; render(); }
      else if (key === "draft") state.draft = el.value;
      else if (key === "signin-email") state.signin.email = el.value;
      else if (key.startsWith("config-")) state.config[key.slice(7)] = el.value.trim();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && state.selected) { state.selected = null; state.editing = false; render(); }
      const el = event.target.closest?.('[role="button"][data-action]');
      if (el && (event.key === "Enter" || event.key === " ")) { event.preventDefault(); el.click(); }
    });
    let resizeTimer = null;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => { if (state.tab === "share") layoutField(); }, 120);
    });

    async function boot() {
      if (window.DASHBOARD_FIXTURE) {
        // Test hook: render recorded view rows without Supabase.
        state.user = { email: window.DASHBOARD_FIXTURE.email || "fixture@example.com" };
        state.authChecked = true;
        return refresh();
      }
      connect();
      state.user = await checkAuth().catch(() => null);
      state.authChecked = true;
      render();
      if (state.user) refresh();
      client?.auth.onAuthStateChange((event, session) => {
        if (event === "SIGNED_IN" && session?.user && !state.user) { state.user = session.user; refresh(); }
        if (event === "SIGNED_OUT") { state.user = null; render(); }
      });
    }
    boot();
  </script>
</body>
</html>
