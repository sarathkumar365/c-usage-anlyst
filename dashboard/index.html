<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Usage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      color-scheme: light;
      --page: #f6f5f1;
      --surface: #fcfcfb;
      --sunken: #f9f8f5;
      --hover: #f3f2ed;
      --chip: #ecebe5;
      --ink: #171614;
      --ink-2: #4a4843;
      --ink-3: #5f5d57;
      --muted: #8e8b84;
      --line: #e5e3dc;
      --line-soft: #ecebe5;
      --line-strong: #dcd9cf;
      --data: #2a78d6;
      --data-dark: #1c5cab;
      --good: #0ca30c;
      --warn: #e39a00;
      --bad: #d03b3b;
      --alert-ink: #a6441f;
      --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
      --serif: "Newsreader", "Iowan Old Style", Georgia, serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--page); color: var(--ink); font-family: var(--sans); font-size: 14px; -webkit-font-smoothing: antialiased; }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    a { color: var(--ink); text-underline-offset: 3px; }
    .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
    .serif { font-family: var(--serif); }
    .muted { color: var(--muted); }
    .ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .app { display: grid; grid-template-columns: 232px minmax(0, 1fr); height: 100vh; }
    .sidebar { display: flex; flex-direction: column; border-right: 1px solid var(--line); padding: 20px 12px 16px; min-height: 0; }
    .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 20px; }
    .brand-mark { width: 22px; height: 22px; border-radius: 6px; background: var(--ink); display: grid; place-items: center; flex-shrink: 0; }
    .brand-name { display: flex; flex-direction: column; gap: 1px; }
    .brand-name strong { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
    .brand-name span { font-size: 12px; color: var(--muted); }
    .nav { display: flex; flex-direction: column; gap: 2px; }
    .nav-group { padding: 16px 8px 6px; font-size: 11px; color: var(--muted); letter-spacing: 0.04em; }
    .nav-group:first-child { padding-top: 0; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 8px; border: 0; border-radius: 6px; background: transparent; color: var(--ink-3); font-size: 13px; text-align: left; width: 100%; }
    .nav-item:hover { background: var(--chip); }
    .nav-item[aria-current="page"] { background: #e7e5de; color: var(--ink); font-weight: 500; }
    .nav-item span:first-of-type { flex-grow: 1; }
    .badge { font-family: var(--mono); font-size: 11px; color: #9a5b00; background: #fbefd5; border-radius: 4px; padding: 1px 6px; }
    .sidebar-foot { margin-top: auto; border-top: 1px solid var(--line); padding: 12px 8px 0; display: flex; align-items: center; gap: 10px; }
    .avatar { width: 28px; height: 28px; border-radius: 14px; background: var(--chip); display: grid; place-items: center; font-size: 11px; font-weight: 600; color: var(--ink-3); flex-shrink: 0; }
    .sidebar-foot .who { display: flex; flex-direction: column; min-width: 0; font-size: 12px; }
    .link-btn { border: 0; background: none; padding: 0; color: var(--muted); font-size: 11px; text-align: left; }
    .link-btn:hover { color: var(--ink); text-decoration: underline; }

    .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .topbar { height: 64px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 32px; border-bottom: 1px solid var(--line); }
    .topbar h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.015em; }
    .topbar .title { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
    .topbar .tools { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .content { flex-grow: 1; overflow: auto; padding: 28px 32px 48px; }
    .divider { width: 1px; height: 20px; background: var(--line); }

    .seg { display: inline-flex; gap: 2px; background: var(--chip); border-radius: 7px; padding: 2px; }
    .seg button { height: 28px; padding: 0 10px; border: 0; border-radius: 5px; background: transparent; color: var(--ink-3); font-size: 12px; }
    .seg button:hover { color: var(--ink); }
    .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(23, 22, 20, 0.08); }
    .btn { height: 32px; display: inline-flex; align-items: center; gap: 8px; padding: 0 12px; border: 1px solid #e0ded6; background: var(--surface); border-radius: 7px; font-size: 13px; }
    .btn:hover { background: #efeee9; }
    .btn.icon { width: 32px; padding: 0; justify-content: center; color: var(--ink-3); }
    .btn.primary { background: var(--ink); color: var(--page); border-color: var(--ink); }
    .btn.primary:hover { background: #2c2a26; }
    .btn[disabled] { opacity: 0.55; cursor: default; }
    .input { height: 32px; padding: 0 10px; border: 1px solid #e0ded6; border-radius: 7px; background: var(--surface); font-size: 13px; width: 100%; }
    .input:focus { outline: none; border-color: var(--ink); }
    .input::placeholder { color: #a3a09a; }
    .spin { animation: spin 900ms linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .view { animation: rise 200ms ease-out; }

    .panel { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
    .panel-head { padding: 18px 20px 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    .panel-head h2 { margin: 0; font-size: 14px; font-weight: 600; }
    .kicker { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .dot { width: 7px; height: 7px; border-radius: 4px; flex-shrink: 0; display: inline-block; }
    .status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; }
    .bar { height: 6px; background: #efeee9; border-radius: 3px; flex-grow: 1; min-width: 24px; }
    .bar > div { height: 6px; background: var(--data); border-radius: 3px; }
    .empty { padding: 48px 20px; text-align: center; color: var(--muted); font-size: 14px; }
    .notice { padding: 12px 16px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--sunken); color: var(--ink-3); font-size: 13px; margin-bottom: 20px; }
    .notice.error { border-color: #efc9bd; background: #fbf0ec; color: var(--alert-ink); }

    /* Tables */
    .table { width: 100%; overflow-x: auto; }
    .trow { display: grid; gap: 16px; align-items: center; padding: 12px 20px; border-top: 1px solid var(--line-soft); min-width: 760px; }
    .trow.head { padding: 9px 20px; font-size: 12px; color: var(--muted); background: var(--sunken); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .trow.head + .trow { border-top: 0; }
    .trow.clickable { cursor: pointer; }
    .trow.clickable:hover { background: var(--hover); }
    .num { text-align: right; }
    .tokens-cell { display: flex; align-items: center; gap: 12px; }
    .tokens-cell .mono:first-child { width: 56px; }
    .tokens-cell .mono:last-child { width: 40px; text-align: right; font-size: 12px; color: var(--muted); }
    .person-cell { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .person-cell .avatar { width: 28px; height: 28px; }
    .stack { display: flex; flex-direction: column; min-width: 0; }
    .sub { font-size: 11px; color: var(--muted); }
    .tag { font-size: 11px; color: var(--ink-3); border: 1px solid #e0ded6; border-radius: 4px; padding: 0 5px; }

    /* Brief */
    .brief-hero { display: grid; grid-template-columns: minmax(0, 2fr) minmax(260px, 1fr); gap: 48px; padding: 4px 0 32px; border-bottom: 1px solid var(--line-strong); }
    .brief-hero h2 { margin: 18px 0; font-family: var(--serif); font-size: clamp(32px, 3.4vw, 48px); line-height: 1.06; font-weight: 400; letter-spacing: -0.02em; text-wrap: balance; }
    .brief-hero h2 button { border: 0; background: none; padding: 0; font: inherit; letter-spacing: inherit; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 7px; text-decoration-color: #c9c6bd; }
    .brief-hero h2 button:hover { text-decoration-color: var(--ink); }
    .dek { margin: 0; max-width: 620px; font-size: 16px; line-height: 1.6; color: var(--ink-2); text-wrap: pretty; }
    .ranking { border-left: 1px solid var(--line-strong); padding-left: 28px; display: flex; flex-direction: column; }
    .rank-row { display: grid; grid-template-columns: 16px minmax(0, 1fr) 52px; gap: 10px; align-items: center; padding: 6px 8px; margin: 0 -8px; border: 0; border-radius: 6px; background: none; text-align: left; }
    .rank-row:hover { background: var(--hover); }
    .rank-row .rule { height: 2px; background: var(--ink); margin-top: 5px; }
    .rank-row.minor .rule { background: #a3a09a; }
    .rank-row.minor .name, .rank-row.minor .mono { color: var(--ink-3); }
    .stories { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding-top: 26px; }
    .story { display: flex; flex-direction: column; gap: 10px; padding: 0 28px; border: 0; border-right: 1px solid var(--line-strong); background: none; text-align: left; }
    .story:first-child { padding-left: 0; }
    .story:last-child { padding-right: 0; border-right: 0; }
    .story h3 { margin: 0; font-family: var(--serif); font-size: 24px; line-height: 1.14; font-weight: 500; letter-spacing: -0.01em; text-wrap: balance; }
    .story:hover h3 { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }
    .story p { margin: 0; font-size: 14px; line-height: 1.6; color: var(--ink-2); text-wrap: pretty; }
    .story .kicker.alert { color: var(--alert-ink); }
    .spark { display: flex; align-items: flex-end; gap: 3px; height: 28px; margin-top: 4px; }
    .spark div { flex: 1 1 0; background: #bdb9ae; min-height: 1px; }
    .spark div.peak { background: var(--ink); }
    .account-strip { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, 1.4fr); gap: 24px; align-items: center; margin-top: 26px; padding: 16px 20px; }
    .account-strip .meter { height: 6px; border-radius: 3px; background: var(--sunken); overflow: hidden; margin-top: 6px; }
    .account-strip .meter div { height: 100%; background: var(--ink); }
    .account-strip .spark { height: 36px; gap: 1px; }
    .brief-foot { margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line-strong); display: flex; justify-content: space-between; gap: 24px; font-size: 13px; color: var(--ink-3); }

    /* Share */
    .field { position: relative; width: 100%; height: min(700px, calc(100vh - 190px)); min-height: 460px; }
    .tile { position: absolute; display: flex; flex-direction: column; overflow: hidden; border: 0; padding: 0; text-align: left; transition: filter 160ms ease; }
    .tile:hover { filter: brightness(1.07); }
    .tile-body { flex-grow: 1; min-height: 0; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; }
    .tile-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 8px 12px; }
    .tile-lines { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
    .tile-strip { display: flex; gap: 2px; height: 32px; flex-shrink: 0; }
    .tile-strip div { min-width: 0; display: flex; align-items: center; padding: 0 12px; font-size: 12px; font-family: var(--mono); white-space: nowrap; overflow: hidden; }
    .flag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; background: #f1efe9; color: var(--alert-ink); padding: 4px 8px; }

    /* Work lanes */
    .lanes { background: #141413; color: #ecebe6; border-radius: 12px; padding: 18px 24px 8px; }
    .lanes-head { display: flex; justify-content: space-between; align-items: center; gap: 24px; padding-bottom: 14px; border-bottom: 1px solid #262523; font-size: 13px; color: #b9b6ad; flex-wrap: wrap; }
    .legend { display: flex; align-items: center; gap: 18px; font-size: 12px; color: #8f8c84; }
    .legend span { display: inline-flex; align-items: center; gap: 8px; }
    .swatch { width: 14px; height: 8px; border-radius: 2px; display: inline-block; }
    .lane-axis { display: grid; grid-template-columns: 264px minmax(0, 1fr); height: 34px; align-items: center; }
    .lane-track { position: relative; height: 100%; }
    .lane-body { position: relative; }
    .lane-bands { position: absolute; left: 264px; right: 0; top: 0; bottom: 0; pointer-events: none; }
    .lane { display: grid; grid-template-columns: 248px minmax(0, 1fr); column-gap: 16px; height: 96px; border-top: 1px solid #262523; }
    .lane-name { display: flex; flex-direction: column; gap: 4px; padding: 12px 8px 0; margin-left: -8px; border: 0; border-radius: 6px; background: none; color: inherit; text-align: left; min-width: 0; }
    .lane-name:hover { background: #1f1e1c; }
    .lane-sessions { position: relative; }
    .session-bar { position: absolute; border-radius: 3px; background: #5e5b55; }
    .session-bar.heavy { background: #3987e5; }
    .session-bar.sub { background: transparent; box-shadow: inset 0 0 0 1.5px #8f8c84; height: 10px; }
    .callout-line { position: absolute; top: 8px; width: 1px; background: #6f6c65; }
    .callout { position: absolute; top: 2px; font-family: var(--mono); font-size: 11px; color: #ecebe6; white-space: nowrap; transform: translateX(calc(-100% - 6px)); }
    .stale-band { position: absolute; top: 16px; height: 68px; background: repeating-linear-gradient(135deg, rgba(210, 81, 42, 0.45) 0 1px, transparent 1px 6px); border-left: 1px solid #d2512a; }
    .stale-label { position: absolute; top: 2px; font-size: 11px; color: #e07a55; white-space: nowrap; transform: translateX(calc(-100% - 6px)); }

    /* Collectors & stats */
    .stat-strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .stat-strip > div { padding: 18px 20px; display: flex; flex-direction: column; gap: 4px; border-right: 1px solid var(--line-soft); }
    .stat-strip > div:last-child { border-right: 0; }
    .stat-strip strong { font-size: 22px; font-weight: 500; letter-spacing: -0.02em; }
    .issue { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 12px 0; border-top: 1px solid var(--line-soft); }
    .issue-icon { width: 20px; height: 20px; border-radius: 10px; display: grid; place-items: center; }
    .mix { display: flex; gap: 2px; height: 10px; }
    .mix div { min-width: 3px; }

    /* Drawer */
    .scrim { position: fixed; inset: 0; background: rgba(23, 22, 20, 0.16); z-index: 10; }
    .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); background: var(--surface); border-left: 1px solid var(--line); box-shadow: -12px 0 32px rgba(23, 22, 20, 0.08); display: flex; flex-direction: column; z-index: 11; animation: slide 200ms ease-out; }
    @keyframes slide { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
    .drawer-head { padding: 20px 24px 18px; border-bottom: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 14px; }
    .drawer-why { padding: 16px 24px; border-bottom: 1px solid var(--line-soft); background: var(--sunken); display: flex; flex-direction: column; gap: 8px; }
    .reason { display: flex; gap: 8px; font-size: 13px; color: #3d3b37; line-height: 1.4; }
    .reason::before { content: ""; width: 4px; height: 4px; border-radius: 2px; background: #b9b6ad; flex-shrink: 0; margin-top: 7px; }
    .drawer-body { flex-grow: 1; overflow: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 24px; }
    .kv { display: flex; justify-content: space-between; gap: 16px; padding: 9px 0; border-top: 1px solid var(--line-soft); font-size: 13px; }
    .kv span:first-child { color: var(--ink-3); }
    .big-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .big-stats div { display: flex; flex-direction: column; gap: 4px; }
    .big-stats strong { font-size: 22px; font-weight: 500; letter-spacing: -0.02em; }

    /* Sign in */
    .signin { min-height: 100vh; display: flex; flex-direction: column; }
    .signin header { height: 64px; display: flex; align-items: center; gap: 10px; padding: 0 32px; }
    .signin main { flex-grow: 1; display: grid; place-items: center; padding: 24px 24px 88px; }
    .signin-card { width: min(360px, 100%); display: flex; flex-direction: column; gap: 28px; }
    .signin-card h1 { margin: 0; font-size: 26px; font-weight: 500; letter-spacing: -0.025em; }
    .signin-card label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--ink-3); }
    .signin-card .input, .signin-card .btn { height: 40px; font-size: 14px; }
    .signin-card .btn { justify-content: center; }

    @media (max-width: 960px) {
      .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); height: auto; min-height: 100vh; }
      .sidebar { flex-direction: row; align-items: center; gap: 8px; padding: 10px 16px; border-right: 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
      .brand { padding: 0 8px 0 0; }
      .brand-name span, .nav-group, .sidebar-foot { display: none; }
      .nav { flex-direction: row; }
      .nav-item { white-space: nowrap; }
      .topbar { height: auto; flex-wrap: wrap; padding: 14px 16px; }
      .topbar .tools { width: 100%; }
      .topbar .divider, .topbar .updated, .topbar .btn-label, .topbar .title .muted { display: none; }
      .content { padding: 20px 16px 40px; overflow: visible; }
      .brief-hero, .stories, .account-strip { grid-template-columns: minmax(0, 1fr); }
      .ranking { border-left: 0; padding-left: 0; }
      .story { padding: 20px 0; border-right: 0; border-top: 1px solid var(--line-strong); }
      .stat-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .lanes { overflow-x: auto; }
      .lane-axis, .lane-body { min-width: 860px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    // ---------------------------------------------------------------------------
    // Config
    // ---------------------------------------------------------------------------
    const DEFAULTS = {
      supabaseUrl: "https://yeokmzmmldqjngwtrfso.supabase.co",
      supabaseKey: "sb_publishable_0NqZnygxACHzi6jMGr2sJA_1TOPXFId",
      orgId: "team-main",
    };
    const STALE_MS = 2 * 60 * 60 * 1000;
    const DAY_MS = 86400000;
    const RANGES = [
      { id: "7", label: "7d", days: 7, kicker: "This week" },
      { id: "30", label: "30d", days: 30, kicker: "This month" },
      { id: "90", label: "90d", days: 90, kicker: "This quarter" },
      { id: "all", label: "All", days: null, kicker: "All time" },
    ];
    const ICONS = {
      brief: "M3 3.5h10M3 6.5h10M3 9.5h6.5M3 12.5h8",
      share: "M2.5 2.5h6v11h-6zM10.5 2.5h3v5h-3zM10.5 9.5h3v4h-3z",
      lanes: "M2.5 4h7M5 8h8.5M2.5 12h4.5",
      people: "M6 7.2a2.4 2.4 0 1 0 0-4.8 2.4 2.4 0 0 0 0 4.8zM1.8 13.5c.4-2.4 2.1-3.8 4.2-3.8s3.8 1.4 4.2 3.8M10.6 2.7a2.3 2.3 0 0 1 0 4.4M12 9.9c1.2.5 2 1.7 2.2 3.6",
      projects: "M2 4.2c0-.7.5-1.2 1.2-1.2h3l1.5 1.6h5.1c.7 0 1.2.5 1.2 1.2v6c0 .7-.5 1.2-1.2 1.2H3.2c-.7 0-1.2-.5-1.2-1.2z",
      sessions: "M8 14A6 6 0 1 0 8 2a6 6 0 0 0 0 12zM8 4.8V8l2.2 1.4",
      collectors: "M2.5 3h11v4h-11zM2.5 9h11v4h-11zM5 5h.01M5 11h.01",
    };
    const TABS = [
      { group: "Views" },
      { id: "brief", label: "Brief", subtitle: "Who is using the most, and why" },
      { id: "share", label: "Share", subtitle: "Everyone’s slice of the team’s usage" },
      { id: "lanes", label: "Work lanes", subtitle: "How each person worked over the last 7 days" },
      { group: "Data" },
      { id: "people", label: "People", subtitle: "Who is using Claude, and on which machine" },
      { id: "projects", label: "Projects & models", subtitle: "Where the tokens go" },
      { id: "sessions", label: "Sessions", subtitle: "The heaviest individual pieces of work" },
      { id: "collectors", label: "Collectors", subtitle: "Sync health and what each machine can see" },
    ];
    const MODEL_COLORS = ["#2a78d6", "#eb6834", "#1baf7a"];
    const OTHER_COLOR = "#b9b6ad";
    const INK_SCALE = ["#1d1c19", "#3a3833", "#55524c", "#726f68", "#a29e94", "#c4c0b5", "#d9d5cb"];

    // ---------------------------------------------------------------------------
    // State & storage
    // ---------------------------------------------------------------------------
    const store = {
      get(key, fallback) { try { return localStorage.getItem(key) ?? fallback; } catch { return fallback; } },
      set(key, value) { try { localStorage.setItem(key, value); } catch { /* storage unavailable */ } },
    };
    const state = {
      config: {
        supabaseUrl: store.get("supabaseUrl", DEFAULTS.supabaseUrl),
        supabaseKey: store.get("anonKey", DEFAULTS.supabaseKey),
        orgId: store.get("orgId", DEFAULTS.orgId),
      },
      tab: store.get("tab", "brief"),
      range: store.get("range", "30"),
      lens: "people",
      sessionFilter: "all",
      query: "",
      selected: null,
      editing: false,
      draft: "",
      user: null,
      authChecked: false,
      loading: false,
      error: null,
      raw: null,
      loadedAt: null,
      signin: { email: store.get("email", ""), sent: false, sending: false, error: null, showConnection: false },
    };
    let client = null;
    let model = null;

    // ---------------------------------------------------------------------------
    // Formatting
    // ---------------------------------------------------------------------------
    const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    const num = (value) => Number(value || 0);
    const compact = (n) => {
      n = num(n);
      if (n >= 1e9) return (n / 1e9).toFixed(2) + "B";
      if (n >= 1e6) return (n / 1e6).toFixed(2) + "M";
      if (n >= 1e4) return Math.round(n / 1e3) + "K";
      if (n >= 1e3) return (n / 1e3).toFixed(1) + "K";
      return String(Math.round(n));
    };
    const pct = (x) => (x > 0 && x < 0.01 ? "<1%" : Math.round(x * 100) + "%");
    const pct1 = (x) => (x * 100).toFixed(1) + "%";
    const int = (n) => Math.round(num(n)).toLocaleString("en-US");
    const duration = (seconds) => {
      const m = Math.round(num(seconds) / 60);
      if (m < 1) return "<1m";
      return m >= 60 ? `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, "0")}m` : `${m}m`;
    };
    const timeAgo = (value) => {
      if (!value) return "never";
      const ms = Date.now() - new Date(value).getTime();
      if (!Number.isFinite(ms)) return "unknown";
      if (ms < 60000) return "just now";
      if (ms < 3600000) return `${Math.round(ms / 60000)} min ago`;
      if (ms < DAY_MS) return `${Math.round(ms / 3600000)} hr ago`;
      if (ms < 2 * DAY_MS) return "yesterday";
      return new Date(value).toLocaleDateString("en-US", { month: "short", day: "numeric" });
    };
    const modelName = (model) => {
      const m = String(model || "").match(/^claude-([a-z]+)-(\d+)(?:-(\d{1,2}))?/);
      if (!m) return model || "Unknown model";
      return `${m[1][0].toUpperCase()}${m[1].slice(1)} ${m[2]}${m[3] ? "." + m[3] : ""}`;
    };
    const initials = (name) => String(name || "?").split(/[\s._-]+/).filter(Boolean).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
    const dayKey = (date) => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
    const startOfDay = (date) => new Date(date.getFullYear(), date.getMonth(), date.getDate());
    const addDays = (date, days) => new Date(date.getFullYear(), date.getMonth(), date.getDate() + days);
    const icon = (path, size = 16) => `<svg width="${size}" height="${size}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${path}"></path></svg>`;
    const countWord = (n) => ["No", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine"][n] || String(n);
    const firstName = (name) => String(name || "").split(" ")[0];
    // Lowercase a leading ordinary word only; keep names like "Haiku 4.5" or "Bash" intact.
    const lowerFirst = (text) => (/^(One|Two|Three|Four|Five|Six|Seven|Eight|Nine|Command-heavy|Reads|Mostly|Short|Spread|No)\b/.test(text) ? text.charAt(0).toLowerCase() + text.slice(1) : text);
    const rangeInfo = () => RANGES.find((r) => r.id === state.range) || RANGES[1];
    const SURFACE_NAMES = { claude_code: "Code", desktop_chat: "Desktop", desktop_app: "Desktop", desktop_code: "Desktop Code", cowork: "Cowork", extensions: "Extensions", ide_extension: "IDE", browser_extension: "Chrome" };
    const ENTRYPOINT_NAMES = { cli: "Terminal", "claude-desktop": "Desktop", "claude-vscode": "VS Code", vscode: "VS Code", jetbrains: "JetBrains", "sdk-cli": "SDK", "sdk-ts": "SDK", "sdk-py": "SDK" };
    const sessionOrigin = (s) => s.desktop_surface === "cowork" || s.surface === "cowork" ? "Cowork" : [...new Set((s.entrypoints || []).map((e) => ENTRYPOINT_NAMES[e] || e))].join(", ");
    const surfaceList = (surfaces) => [...new Set([...surfaces].map((s) => SURFACE_NAMES[s] || s))].join(", ");
    // platform.release is the kernel version on macOS, so only the OS family and architecture are shown.
    const platformLabel = (platform) => [{ Darwin: "macOS", Windows: "Windows", Linux: "Linux" }[platform?.system] || platform?.system, platform?.machine].filter(Boolean).join(" · ");

    // ---------------------------------------------------------------------------
    // Auth
    // ---------------------------------------------------------------------------
    function connect() {
      const { supabaseUrl, supabaseKey } = state.config;
      client = supabaseUrl && supabaseKey
        ? window.supabase.createClient(supabaseUrl, supabaseKey, { auth: { detectSessionInUrl: true, persistSession: true, autoRefreshToken: true } })
        : null;
    }

    async function restoreSessionFromUrl() {
      if (!client || !window.location.hash.includes("access_token")) return;
      const params = new URLSearchParams(window.location.hash.slice(1));
      const access_token = params.get("access_token");
      const refresh_token = params.get("refresh_token");
      if (access_token && refresh_token) await client.auth.setSession({ access_token, refresh_token });
      history.replaceState(null, document.title, window.location.pathname + window.location.search);
    }

    async function checkAuth() {
      if (!client) return null;
      await restoreSessionFromUrl();
      const { data } = await client.auth.getUser();
      return data?.user || null;
    }

    async function sendLink() {
      const email = state.signin.email.trim();
      if (!email) { state.signin.error = "Enter your work email."; return render(); }
      store.set("email", email);
      state.signin.sending = true; state.signin.error = null; render();
      // Supabase matches redirect URLs exactly, and allowlist entries are usually written without a trailing slash.
      const redirect = window.location.origin + (window.location.pathname === "/" ? "" : window.location.pathname);
      const { error } = await client.auth.signInWithOtp({ email, options: { emailRedirectTo: redirect } });
      state.signin.sending = false;
      if (error) state.signin.error = error.message; else state.signin.sent = true;
      render();
    }

    async function signOut() {
      if (client) await client.auth.signOut();
      state.user = null; state.raw = null; model = null;
      render();
    }

    // ---------------------------------------------------------------------------
    // Data loading (paged, so no view is silently capped at PostgREST's row limit)
    // ---------------------------------------------------------------------------
    const PAGE = 1000;
    async function fetchAll(view, order, filter) {
      const rows = [];
      for (let from = 0; ; from += PAGE) {
        let query = client.from(view).select("*").eq("org_id", state.config.orgId);
        if (filter) query = filter(query);
        for (const column of order) query = query.order(column, { ascending: true });
        const { data, error } = await query.range(from, from + PAGE - 1);
        if (error) throw new Error(`${view}: ${error.message}`);
        rows.push(...data);
        if (data.length < PAGE) return rows;
      }
    }

    async function refresh() {
      if (window.DASHBOARD_FIXTURE) { state.raw = window.DASHBOARD_FIXTURE; state.loadedAt = new Date(); return render(); }
      if (!client || !state.user) return;
      const range = rangeInfo();
      const today = startOfDay(new Date());
      // Twice the range, so the brief can compare against the previous period; at least 7 days for work lanes.
      const since = range.days ? dayKey(addDays(today, -(range.days * 2 - 1))) : null;
      const sessionSince = addDays(today, -Math.max(6, range.days ? range.days - 1 : 6));
      state.loading = true; state.error = null; render();
      try {
        const identity = ["collector_id", "machine_id", "user_id", "account_label"];
        const sessionFilter = (column) => (q) => (range.days ? q.gte(column, sessionSince.toISOString()) : q);
        const [people, projects, models, sessions, anomalies, sources, tools, collectors, accounts, features, planUsage] = await Promise.all([
          fetchAll("dashboard_people_usage", identity),
          fetchAll("dashboard_user_project_usage", ["day", ...identity, "surface", "confidence", "project"], (q) => (since ? q.gte("day", since) : q)),
          fetchAll("dashboard_user_model_usage", ["day", ...identity, "surface", "confidence", "model_label"], (q) => (since ? q.gte("day", since) : q)),
          fetchAll("dashboard_sessions", [...identity, "session_id"], sessionFilter("last_ts")),
          fetchAll("dashboard_anomalies", ["collector_id", "machine_id", "user_id", "code"]),
          fetchAll("dashboard_sources", [...identity, "source_id"]),
          fetchAll("dashboard_person_tools", [...identity, "tool"]),
          fetchAll("dashboard_collectors", identity),
          fetchAll("dashboard_accounts", ["collector_id", "machine_id", "user_id", "account_uuid"]),
          fetchAll("dashboard_features", ["collector_id", "machine_id", "user_id", "kind", "name"]),
          // Same window as sessions, so rises in the account's usage can be matched against tracked activity.
          fetchAll("dashboard_plan_usage", ["organization_uuid", "bucket_at"], sessionFilter("bucket_at")),
        ]);
        state.raw = { people, projects, models, sessions, anomalies, sources, tools, collectors, accounts, features, planUsage };
        state.loadedAt = new Date();
      } catch (error) {
        state.error = error.message;
      }
      state.loading = false;
      render();
    }

    async function saveAlias() {
      const person = model?.byKey.get(state.selected);
      if (!person || !client) return;
      const name = state.draft.trim();
      const table = client.from("identity_aliases");
      const result = name && name !== person.fallbackName
        ? await table.upsert({ org_id: state.config.orgId, entity_type: "user", entity_id: person.user_id, display_name: name, updated_at: new Date().toISOString() })
        : await table.delete().eq("org_id", state.config.orgId).eq("entity_type", "user").eq("entity_id", person.user_id);
      if (result.error) { state.error = `Rename failed: ${result.error.message}. Only organization admins can rename people.`; state.editing = false; return render(); }
      state.editing = false;
      await refresh();
    }

    // ---------------------------------------------------------------------------
    // Model: raw view rows -> people, projects, models, reasons for the chosen range
    // ---------------------------------------------------------------------------
    const keyOf = (row) => [row.user_id, row.machine_id, row.collector_id, row.account_label || ""].join("|");
    const bump = (map, key, value) => map.set(key, (map.get(key) || 0) + value);
    const topEntry = (map) => [...map.entries()].sort((a, b) => b[1] - a[1])[0] || null;
    const sortedEntries = (map) => [...map.entries()].sort((a, b) => b[1] - a[1]);

    function deriveModel(raw) {
      const range = rangeInfo();
      const today = startOfDay(new Date());
      const cutoff = range.days ? addDays(today, -(range.days - 1)) : null;
      const cutoffKey = cutoff ? dayKey(cutoff) : null;
      const prevKey = cutoff ? dayKey(addDays(cutoff, -range.days)) : null;
      const inRange = (day) => !cutoffKey || day >= cutoffKey;
      const inPrev = (day) => Boolean(prevKey) && day >= prevKey && day < cutoffKey;

      const byKey = new Map();
      const ensure = (row) => {
        const key = keyOf(row);
        if (!byKey.has(key)) {
          byKey.set(key, {
            key, user_id: row.user_id, machine_id: row.machine_id, collector_id: row.collector_id, account_label: row.account_label || "",
            name: row.person_label || String(row.user_id).slice(0, 10), fallbackName: row.os_username || String(row.user_id).slice(0, 10),
            machine: row.machine_label || row.hostname || String(row.machine_id).slice(0, 10), account: row.account_display_label || "",
            meta: null, collector: null, tokens: 0, prevTokens: 0, requests: 0, cache: 0,
            projects: new Map(), models: new Map(), days: new Map(), sessions: [], allSessions: [], tools: [], anomalies: [], surfaces: new Set(),
            accounts: [], features: [],
          });
        }
        return byKey.get(key);
      };

      for (const row of raw.people) { const p = ensure(row); p.meta = row; p.name = row.person_label || p.name; p.fallbackName = row.os_username || p.fallbackName; }
      for (const row of raw.collectors || []) ensure(row).collector = row;
      const teamProjects = new Map();
      let firstDay = null;
      for (const row of raw.projects) {
        const p = ensure(row);
        const tokens = num(row.reported_total);
        if (!firstDay || row.day < firstDay) firstDay = row.day;
        if (inRange(row.day)) {
          p.tokens += tokens; p.requests += num(row.requests); p.cache += num(row.cache_tokens);
          const projectName = row.project_name || row.project;
          bump(p.projects, projectName, tokens);
          bump(p.days, row.day, tokens);
          if (!teamProjects.has(projectName)) teamProjects.set(projectName, { name: projectName, tokens: 0, cache: 0, requests: 0, people: new Map() });
          const tp = teamProjects.get(projectName);
          tp.tokens += tokens; tp.cache += num(row.cache_tokens); tp.requests += num(row.requests); bump(tp.people, p.key, tokens);
        } else if (inPrev(row.day)) {
          p.prevTokens += tokens;
        }
      }
      const teamModels = new Map();
      for (const row of raw.models) {
        if (!inRange(row.day)) continue;
        const p = ensure(row);
        const tokens = num(row.reported_total);
        bump(p.models, row.model_label, tokens);
        if (!teamModels.has(row.model_label)) teamModels.set(row.model_label, { name: row.model_label, tokens: 0, requests: 0, web: 0 });
        const tm = teamModels.get(row.model_label);
        tm.tokens += tokens; tm.requests += num(row.requests); tm.web += num(row.web_search_requests);
      }
      const laneStart = addDays(today, -6);
      for (const row of raw.sessions) {
        const p = ensure(row);
        p.allSessions.push(row);
        if (!cutoff || new Date(row.last_ts) >= cutoff) p.sessions.push(row);
      }
      for (const row of raw.tools) ensure(row).tools.push({ tool: row.tool, calls: num(row.calls) });
      // These rows carry no account label, so they attach to every person on the same collector identity.
      const sameIdentity = (row) => [...byKey.values()].filter((p) => p.user_id === row.user_id && p.machine_id === row.machine_id && p.collector_id === row.collector_id);
      for (const row of raw.anomalies) for (const p of sameIdentity(row)) p.anomalies.push(row);
      for (const row of raw.accounts || []) for (const p of sameIdentity(row)) p.accounts.push(row);
      for (const row of raw.features || []) for (const p of sameIdentity(row)) p.features.push(row);
      for (const row of raw.sources) if (row.status === "present") ensure(row).surfaces.add(row.surface);

      const people = [...byKey.values()];
      const account = deriveAccount(raw.planUsage || [], people, cutoff);
      for (const p of people) {
        const orgs = p.accounts.map((a) => a.organization_uuid).filter(Boolean);
        p.claudeAccount = p.accounts.find((a) => a.organization_uuid === account.organization) || p.accounts.find((a) => a.organization_uuid) || p.accounts[0] || null;
        p.otherAccount = Boolean(account.organization) && orgs.length > 0 && !orgs.includes(account.organization);
        const sync = p.collector || p.meta;
        const lastSync = sync?.last_sync_at ? new Date(sync.last_sync_at).getTime() : 0;
        p.lastSync = sync?.last_sync_at || null;
        p.version = sync?.collector_version || "";
        p.platform = sync?.platform || {};
        p.stale = Boolean(sync) && (!lastSync || Date.now() - lastSync > STALE_MS);
        p.warn = p.anomalies.some((a) => a.severity === "warn" || a.severity === "bad");
        // A collector that syncs but has never sent usage (e.g. no Claude Code on that machine) is not healthy.
        p.noData = !p.meta && Boolean(p.collector);
        p.status = p.stale ? { label: "Stale", color: "var(--bad)" } : p.noData ? { label: "No data found", color: "var(--warn)" } : p.warn ? { label: "Check setup", color: "var(--warn)" } : { label: "Healthy", color: "var(--good)" };
      }

      const total = people.reduce((acc, p) => acc + p.tokens, 0);
      const prevTotal = people.reduce((acc, p) => acc + p.prevTokens, 0);
      const cacheTotal = people.reduce((acc, p) => acc + p.cache, 0);
      const ranked = people.filter((p) => p.tokens > 0).sort((a, b) => b.tokens - a.tokens);
      for (const p of people) {
        p.share = total ? p.tokens / total : 0;
        p.reasons = reasonsFor(p);
        p.topProject = topEntry(p.projects)?.[0] || "";
        p.topModel = topEntry(p.models)?.[0] || "";
      }
      const projects = [...teamProjects.values()].sort((a, b) => b.tokens - a.tokens);
      const models = [...teamModels.values()].sort((a, b) => b.tokens - a.tokens);
      const issues = buildIssues(people);
      return { range, today, cutoff, laneStart, people, byKey, ranked, total, prevTotal, cacheShare: total ? cacheTotal / total : 0, firstDay, projects, models, issues, account };
    }

    // The shared account: the organization most collectors are signed in to, its usage % over the range, and how
    // much of the 5-hour usage rose while no collector showed activity (claude.ai web or untracked machines).
    function deriveAccount(planUsage, people, cutoff) {
      const collectorsByOrg = new Map();
      for (const p of people) for (const a of p.accounts) if (a.organization_uuid) {
        if (!collectorsByOrg.has(a.organization_uuid)) collectorsByOrg.set(a.organization_uuid, new Set());
        collectorsByOrg.get(a.organization_uuid).add(p.collector_id);
      }
      const sampleCounts = new Map();
      for (const row of planUsage) bump(sampleCounts, row.organization_uuid, 1);
      const organization = [...collectorsByOrg.entries()].sort((a, b) => b[1].size - a[1].size)[0]?.[0] || topEntry(sampleCounts)?.[0] || null;
      const named = people.flatMap((p) => p.accounts).find((a) => a.organization_uuid === organization && a.organization_name);
      const points = planUsage
        .filter((row) => row.organization_uuid === organization && (!cutoff || new Date(row.bucket_at) >= cutoff))
        .sort((a, b) => new Date(a.bucket_at) - new Date(b.bucket_at));

      const BUFFER_MS = 10 * 60 * 1000;
      const spans = people.flatMap((p) => p.allSessions)
        .map((s) => [new Date(s.first_ts || s.last_ts).getTime() - BUFFER_MS, new Date(s.last_ts).getTime() + BUFFER_MS]);
      const tracked = (from, to, row) => (row.sources || []).includes("statusline") || spans.some(([a, b]) => a <= to && b >= from);
      let rise = 0;
      let unattributed = 0;
      for (let i = 1; i < points.length; i++) {
        const delta = num(points[i].five_hour_pct) - num(points[i - 1].five_hour_pct);
        if (delta <= 0) continue;
        rise += delta;
        if (!tracked(new Date(points[i - 1].bucket_at).getTime(), new Date(points[i].bucket_at).getTime(), points[i])) unattributed += delta;
      }
      const latest = points[points.length - 1] || null;
      return {
        organization,
        name: named?.organization_name || (organization ? `Account ${organization.slice(0, 8)}` : ""),
        collectors: collectorsByOrg.get(organization)?.size || 0,
        points,
        latest,
        unattributedShare: rise ? unattributed / rise : null,
      };
    }

    function reasonsFor(p) {
      const reasons = [];
      const sessions = p.sessions.filter((s) => num(s.reported_total) > 0);
      const sessionTokens = sessions.reduce((acc, s) => acc + num(s.reported_total), 0);
      const biggest = sessions.slice().sort((a, b) => num(b.reported_total) - num(a.reported_total))[0];
      if (biggest && p.tokens && num(biggest.reported_total) / p.tokens >= 0.25) {
        reasons.push({ kind: "single", project: biggest.project_name, text: `One ${duration(biggest.duration_seconds)} session is ${pct(Math.min(1, num(biggest.reported_total) / p.tokens))} of the total` });
      }
      const long = sessions.filter((s) => num(s.duration_seconds) >= 7200);
      if (long.length >= 2) reasons.push({ kind: "long", count: long.length, text: `${countWord(long.length)} sessions ran longer than 2 hours` });
      const subTokens = sessions.filter((s) => s.is_subagent).reduce((acc, s) => acc + num(s.reported_total), 0);
      const subRuns = sessions.filter((s) => s.is_subagent).length;
      if (sessionTokens && subTokens / sessionTokens >= 0.15) reasons.push({ kind: "subagents", text: `${countWord(subRuns)} subagent runs are ${pct(subTokens / sessionTokens)} of tokens` });
      const cacheShare = p.tokens ? p.cache / p.tokens : 0;
      if (cacheShare >= 0.9) reasons.push({ kind: "cache", text: `${pct(cacheShare)} of tokens are context being reread` });
      const topModel = topEntry(p.models);
      if (topModel && p.tokens && topModel[1] / p.tokens >= 0.75 && topModel[0] !== "Unknown model") {
        reasons.push({ kind: "model", model: topModel[0], text: `${modelName(topModel[0])} for ${pct(topModel[1] / p.tokens)} of the work` });
      }
      const toolTotal = p.tools.reduce((acc, t) => acc + t.calls, 0);
      const topTool = p.tools.slice().sort((a, b) => b.calls - a.calls)[0];
      if (topTool && toolTotal >= 20 && topTool.calls / toolTotal >= 0.4) {
        const share = pct(topTool.calls / toolTotal);
        const phrase = { Bash: `Command-heavy: ${share} of tool calls run commands`, Read: `Reads many files: ${share} of tool calls are Read`, Edit: `Mostly editing: ${share} of tool calls are Edit` }[topTool.tool];
        reasons.push({ kind: "tool", text: phrase || `${share} of tool calls are ${topTool.tool}` });
      }
      const avg = sessions.length ? sessions.reduce((acc, s) => acc + num(s.duration_seconds), 0) / sessions.length : 0;
      if (sessions.length >= 3 && avg < 1200 && !reasons.length) reasons.push({ kind: "short", text: "Short sessions, no single large run" });
      if (!reasons.length) reasons.push({ kind: "spread", text: sessions.length ? `Spread across ${sessions.length} session${sessions.length === 1 ? "" : "s"}` : "No session detail for this range" });
      return reasons;
    }

    function buildIssues(people) {
      const issues = [];
      for (const p of people) {
        if (p.otherAccount) issues.push({ tone: "warn", person: p, title: `${p.name} is signed in to a different Claude account`, detail: `${p.machine} uses ${p.claudeAccount?.organization_name || "another organization"}, so its usage is not the shared account's.`, seen: timeAgo(p.claudeAccount?.last_seen_at) });
      }
      for (const p of people) {
        if (p.stale) issues.push({ tone: "bad", person: p, title: `${p.name}’s collector is stale`, detail: `No sync from ${p.machine} since ${timeAgo(p.lastSync)}. Usage after that isn’t counted yet.`, seen: timeAgo(p.lastSync) });
      }
      const seen = new Set();
      for (const p of people) {
        for (const a of p.anomalies) {
          const id = `${a.collector_id}|${a.code}`;
          if (seen.has(id) || a.severity === "info") continue;
          seen.add(id);
          issues.push({ tone: a.severity === "bad" ? "bad" : "warn", person: p, title: `${a.code.charAt(0).toUpperCase()}${a.code.slice(1).replaceAll("_", " ")} on ${p.machine}`, detail: a.message, seen: timeAgo(a.last_seen_at) });
        }
      }
      return issues;
    }

    function headlinePhrase(p) {
      const project = p.topProject;
      const on = project ? ` on ${project}` : "";
      const lead = p.reasons[0];
      switch (lead.kind) {
        case "single": return `through one long session${lead.project ? ` on ${lead.project}` : on}`;
        case "long": return `through ${lowerFirst(countWord(lead.count))} sessions longer than 2 hours${on}`;
        case "subagents": return `by handing work to subagents${on}`;
        case "model": return `with ${modelName(lead.model)}${on}`;
        default: return project ? `working on ${project}` : "across several sessions";
      }
    }

    // ---------------------------------------------------------------------------
    // Rendering: shell
    // ---------------------------------------------------------------------------
    function render() {
      const app = document.getElementById("app");
      const focus = document.activeElement?.dataset?.focus;
      const caret = document.activeElement?.selectionStart;
      if (!state.authChecked) { app.innerHTML = ""; return; }
      if (!state.user) { app.innerHTML = renderSignin(); return restoreFocus(focus, caret); }
      model = state.raw ? deriveModel(state.raw) : null;
      app.innerHTML = renderApp();
      if (state.tab === "share") layoutField();
      restoreFocus(focus, caret);
    }

    function restoreFocus(focus, caret) {
      if (!focus) return;
      const el = document.querySelector(`[data-focus="${focus}"]`);
      if (!el) return;
      el.focus();
      if (typeof caret === "number" && el.setSelectionRange) el.setSelectionRange(caret, caret);
    }

    function renderSignin() {
      const s = state.signin;
      const host = (() => { try { return new URL(state.config.supabaseUrl).host; } catch { return state.config.supabaseUrl || "not set"; } })();
      return `
        <div class="signin">
          <header>${brandMark()}<strong style="font-size:14px;font-weight:600;letter-spacing:-0.01em;">Claude Usage</strong></header>
          <main>
            <div class="signin-card">
              <div style="display:flex;flex-direction:column;gap:8px;">
                <h1>${s.sent ? "Check your inbox" : `Sign in to ${esc(state.config.orgId)}`}</h1>
                <p class="muted" style="margin:0;font-size:14px;line-height:1.5;color:var(--ink-3);">${s.sent ? `We sent a sign-in link to ${esc(s.email)}. Open it on this device.` : "We’ll email you a one-time link. Only members of this organization can see usage."}</p>
              </div>
              ${s.sent ? `<button class="btn" data-action="signin-reset">Use a different email</button>` : `
                <form data-action="send-link" style="display:flex;flex-direction:column;gap:12px;">
                  <label>Work email<input class="input" type="email" autocomplete="email" data-focus="email" data-input="signin-email" value="${esc(s.email)}" placeholder="you@company.com"></label>
                  <button class="btn primary" type="submit" ${s.sending ? "disabled" : ""}>${s.sending ? "Sending…" : "Email me a sign-in link"}</button>
                  ${s.error ? `<div class="notice error" style="margin:0;">${esc(s.error)}</div>` : ""}
                </form>`}
              <div style="border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px;">
                <div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;">
                  <span style="color:var(--ink-3);">Connected to</span>
                  <button class="link-btn" style="font-size:13px;" data-action="toggle-connection">${s.showConnection ? "Done" : "Change"}</button>
                </div>
                ${s.showConnection ? `
                  <label style="font-size:12px;">Supabase URL<input class="input" data-input="config-supabaseUrl" data-focus="cfg-url" value="${esc(state.config.supabaseUrl)}"></label>
                  <label style="font-size:12px;">Publishable key<input class="input" data-input="config-supabaseKey" data-focus="cfg-key" value="${esc(state.config.supabaseKey)}"></label>
                  <label style="font-size:12px;">Organization<input class="input" data-input="config-orgId" data-focus="cfg-org" value="${esc(state.config.orgId)}"></label>` : `
                  <div style="display:flex;flex-direction:column;gap:2px;">
                    <span class="mono" style="font-size:12px;">${esc(host)}</span>
                    <span class="muted" style="font-size:12px;">Organization ${esc(state.config.orgId)}</span>
                  </div>`}
              </div>
            </div>
          </main>
        </div>`;
    }

    const brandMark = () => `<div class="brand-mark"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M2 9.5V6M6 9.5V2.5M10 9.5V4.5" stroke="#f6f5f1" stroke-width="1.6" stroke-linecap="round"></path></svg></div>`;

    function renderApp() {
      const tab = TABS.find((t) => t.id === state.tab) || TABS[1];
      const issueCount = model ? model.issues.length : 0;
      const email = state.user.email || "Signed in";
      const nav = TABS.map((t) => t.group
        ? `<div class="nav-group">${t.group}</div>`
        : `<button class="nav-item" data-action="tab" data-id="${t.id}" ${t.id === state.tab ? 'aria-current="page"' : ""}>${icon(ICONS[t.id])}<span>${t.label}</span>${t.id === "collectors" && issueCount ? `<span class="badge">${issueCount}</span>` : ""}</button>`).join("");
      const ranges = RANGES.map((r) => `<button data-action="range" data-id="${r.id}" aria-pressed="${r.id === state.range}">${r.label}</button>`).join("");
      return `
        <div class="app">
          <aside class="sidebar">
            <div class="brand">${brandMark()}<div class="brand-name"><strong>Claude Usage</strong><span>${esc(state.config.orgId)}</span></div></div>
            <nav class="nav">${nav}</nav>

              <div class="avatar">${esc(initials(email))}</div>
              <div class="who"><span class="ellipsis">${esc(email)}</span><button class="link-btn" data-action="sign-out">Sign out</button></div>
            </div>
          </aside>
          <section class="main">
            <header class="topbar">
              <div class="title"><h1>${tab.label}</h1><span class="muted ellipsis" style="font-size:13px;">${tab.subtitle}</span></div>
              <div class="tools">
                <div class="seg" role="group" aria-label="Date range">${ranges}</div>
                <span class="divider"></span>
                <span class="muted updated" style="font-size:12px;">${state.loading ? "Loading…" : state.loadedAt ? `Updated ${timeAgo(state.loadedAt)}` : ""}</span>
                <button class="btn icon" data-action="refresh" title="Refresh" aria-label="Refresh"><span class="${state.loading ? "spin" : ""}" style="display:grid;">${icon("M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3", 15)}</span></button>
                <button class="btn" data-action="export" aria-label="Export CSV">${icon("M8 2.5v8M4.5 7 8 10.5 11.5 7M2.5 13.5h11", 14)}<span class="btn-label">Export CSV</span></button>

              ${state.error ? `<div class="notice error">${esc(state.error)}</div>` : ""}
              ${renderTab()}

        </div>
        ${renderDrawer()}`;
