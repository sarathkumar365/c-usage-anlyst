# Netlify serves the static dashboard as-is; scripts/build-site.mjs is only for the worker host.
[build]
  command = ""
  publish = "dashboard"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # The page is one file with inline script and styles; supabase-js is pinned with SRI; data comes only from Supabase.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://yeokmzmmldqjngwtrfso.supabase.co wss://yeokmzmmldqjngwtrfso.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
