# Netlify serves the static dashboard as-is; scripts/build-site.mjs is only for the worker host.
[build]
  command = ""
  publish = "dashboard"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
